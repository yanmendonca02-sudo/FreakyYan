<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Treino FreakJota do Yan Mendonça: Pull, Push, Legs, Full-upper, cronômetro de descanso, cardio e histórico.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yan Treino">
<title>Yan Mendonça — Treino</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#111;--s2:#1a1a1a;--ln:#2b2b2b;--red:#e5121b;--hot:#ff3b3b;--tx:#f5f5f5;--mu:#8e8e8e;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 Manrope,system-ui,sans-serif}
body{min-height:100%;padding:env(safe-area-inset-top,0px) 0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 60% at 100% 0,rgba(229,18,27,.22),transparent 60%);pointer-events:none}
.w{max-width:520px;margin:0 auto;padding:0 18px;position:relative}
h1,h2,h3,.big{font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;margin:0;line-height:.95}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
/* hero */
.hero{padding:26px 0 14px;overflow:hidden}
.hero small{color:var(--mu);font-weight:600}
.name{font-size:clamp(54px,17vw,84px);font-weight:900;display:flex;flex-wrap:wrap;gap:0 .22em;margin-top:4px}
.name span{display:inline-block;overflow:hidden}
.name i{display:inline-block;font-style:normal;transform:translateY(105%);animation:up .7s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--n)*45ms)}
.name .r{color:var(--red)}
.slash{height:6px;background:linear-gradient(90deg,var(--red),var(--hot));transform:scaleX(0);transform-origin:left;animation:sx .9s .6s cubic-bezier(.2,.9,.2,1) forwards;margin-top:8px;border-radius:3px}
@keyframes up{to{transform:none}}@keyframes sx{to{transform:scaleX(1)}}
/* views */
#v>*{animation:in .45s cubic-bezier(.2,.9,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.pills{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.pill{flex:0 0 auto;min-width:48px;height:48px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font:900 22px "Big Shoulders Display",Impact,sans-serif;transition:.25s}
.pill.on{background:var(--red);border-color:var(--red);box-shadow:0 6px 24px rgba(229,18,27,.45);transform:translateY(-2px)}
.pill.td:not(.on){border-color:var(--red)}
.dh{padding:10px 0 4px}
.dh h2{font-size:44px;font-weight:900}
.dh p{margin:4px 0 0;color:var(--mu)}
.bar{height:8px;background:var(--s2);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--hot));transition:width .5s cubic-bezier(.2,.9,.2,1);border-radius:6px}
.pc{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-weight:600}
details{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:14px 0}
summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--red);font-size:20px;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:10px 0 0;color:#cfcfcf}
.sec{font:900 26px "Big Shoulders Display",Impact,sans-serif;margin:24px 0 4px;color:var(--mu)}
.ex{background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--red);border-radius:16px;padding:14px;margin:10px 0;animation:in .45s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.ex.ok{border-left-color:#fff;opacity:.62}
.eh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eh h3{font-size:25px;font-weight:700;line-height:1.05}
.rb{flex:0 0 auto;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:5px 9px;font-weight:800;font-size:12px;color:var(--mu);transition:.2s}
.rb:active{transform:scale(.92);color:var(--tx)}
.no{margin:6px 0 0;color:#bdbdbd;font-size:13px}
.fd{margin:6px 0 0;color:var(--hot);font-size:12.5px;font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.st{min-height:46px;padding:0 16px;border-radius:12px;background:var(--s2);border:1.5px solid var(--ln);font-weight:800;transition:transform .15s,background .25s,border-color .25s}
.st:active{transform:scale(.93)}
.st.on{background:var(--red);border-color:var(--red);animation:pop .35s}
.st.on::before{content:"✓ "}
@keyframes pop{40%{transform:scale(1.14)}}
.fin{width:100%;height:58px;margin:26px 0 8px;border-radius:16px;background:linear-gradient(90deg,var(--red),var(--hot));font:900 26px "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;box-shadow:0 10px 34px rgba(229,18,27,.4);transition:transform .15s}
.fin:active{transform:scale(.97)}
/* rest sheet */
#rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:#150404;border:1px solid var(--red);border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:14px;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:20;box-shadow:0 14px 40px rgba(229,18,27,.35)}
#rest.on{transform:none}#rest.go{animation:flash .5s 3}
@keyframes flash{50%{background:var(--red)}}
#rest svg{width:64px;height:64px;transform:rotate(-90deg)}
#rest .tr{stroke:#3a1212}#rest .pg{stroke:var(--hot);stroke-linecap:round;stroke-dasharray:276.5;transition:stroke-dashoffset .25s linear}
#rest div{flex:1}#rest small{color:var(--mu);font-weight:700}
#rt{font:900 40px "Big Shoulders Display",Impact,sans-serif;display:block;line-height:1}
#rest button{background:var(--s2);border-radius:10px;padding:9px 12px;font-weight:800}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);z-index:30}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:700;color:var(--mu);position:relative;transition:color .25s}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--tx)}nav button.on svg{transform:translateY(-3px) scale(1.15);stroke:var(--hot)}
nav button.on::after{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--red);animation:sx .3s both}
/* cardio */
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:22px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:var(--s2)}.ring .pg{stroke:var(--red);stroke-linecap:round;stroke-dasharray:691;transition:stroke-dashoffset .4s linear;filter:drop-shadow(0 0 8px rgba(255,59,59,.7))}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:78px;font-weight:900}
.ring.run{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.025)}}
.row{display:flex;gap:10px;justify-content:center}
.btn{height:54px;padding:0 24px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);font-weight:800}
.btn.p{background:var(--red);border-color:var(--red);min-width:150px;box-shadow:0 8px 26px rgba(229,18,27,.4)}
.btn:active{transform:scale(.95)}
.mu{color:var(--mu)}.ctr{text-align:center}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal em{font-style:normal;color:var(--mu);font-size:12px;text-align:center;font-weight:700}
.cal i{display:block}
.cal b{aspect-ratio:1;border-radius:12px;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;position:relative;animation:in .4s both;animation-delay:calc(var(--i)*12ms)}
.cal b.h{background:var(--red)}.cal b.td{outline:2px solid #fff;outline-offset:-2px}
.cal u{text-decoration:none;font:900 13px "Big Shoulders Display",Impact,sans-serif}
.cal s{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff}
.hd{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.hd button{width:44px;height:44px;border-radius:12px;background:var(--s1);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}
.stats .big{font-size:42px;color:var(--hot);font-weight:900}.stats span{font-size:12px;color:var(--mu);font-weight:700}
/* guia */
.rpe{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;margin:8px 0}
.rpe strong{font:900 26px "Big Shoulders Display",Impact,sans-serif}
.rpe div{background:var(--s1);border-radius:10px;padding:9px 12px;position:relative;overflow:hidden;font-size:13.5px}
.rpe div::before{content:"";position:absolute;inset:0;background:var(--red);opacity:.35;transform-origin:left;transform:scaleX(0);animation:sx 1s .2s forwards;width:var(--w)}
.rpe span{position:relative}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));translate:-50% -200%;background:#fff;color:#000;font-weight:800;padding:12px 18px;border-radius:14px;transition:translate .5s cubic-bezier(.2,.9,.2,1);z-index:50}
#toast.on{translate:-50% 0}
.pt{position:fixed;width:9px;height:9px;border-radius:2px;background:var(--red);z-index:60;pointer-events:none;animation:bst 1.1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes bst{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;animation-iteration-count:1!important}.name i{transform:none}.slash{transform:none}}
</style>
</head>
<body>
<header class="w hero">
  <small id="dt"></small>
  <h1 class="name" id="nm"></h1>
  <div class="slash"></div>
</header>
<main class="w" id="v"></main>
<div id="rest" role="timer">
  <svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44" fill="none" stroke-width="8"/><circle class="pg" id="rr" cx="50" cy="50" r="44" fill="none" stroke-width="8"/></svg>
  <div><small>Descanso</small><span id="rt">0:00</span></div>
  <button id="r15">+15s</button><button id="rsk">Pular</button>
</div>
<div id="toast"></div>
<nav id="nav">
  <button data-t="t" class="on"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Treino</button>
  <button data-t="c"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Cardio</button>
  <button data-t="h"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Histórico</button>
  <button data-t="g"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11"/></svg>Guia</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const X=(n,r,s,o)=>({n,r,s,o});
const H='9–15|9–15',CL='Cluster 12',CN='Cluster: carga de 8 reps · 3 reps, 15s de pausa, 3 reps… até 12',PK='2s de pico';
const D={
A:{n:'Pull',t:'Costas, trapézio e bíceps',u:1,e:[
X('Puxada pela frente · supinada',150,'5–9|9–15'),X('High-row · unilateral',150,'5–9|9–15','Máquina ou cross'),X('Pulldown com corda',120,H),X('Remada unilateral na máquina · neutra',150,'5–9|9–15'),X('Facepull com corda',105,H,PK),X('Encolhimento com halteres',90,'15–20|15–20'),X('Rosca martelo alternada',90,'9–15'),X('Rosca Scott na máquina',90,'9–15')]},
B:{n:'Push',t:'Peito, ombros e tríceps',u:1,e:[
X('Crucifixo na máquina',120,H,PK),X('Supino 30° no smith',150,'5–9|'+CL,CN),X('Supino vertical articulado',150,'5–9|'+CL,CN),X('Paralelas',120,'Falha|Falha'),X('Desenvolvimento na máquina',150,'5–9|9–15'),X('Elevação lateral com halteres',120,H,'Peito apoiado no banco inclinado'),X('Elevação lateral no cross · unilateral',120,H,'Polia na altura do quadril'),X('Tríceps francês unilateral no cross',90,'9–15'),X('Tríceps corda',90,'9–15')]},
C:{n:'Legs Quad+',t:'Ênfase em quadríceps',e:[
X('Agachamento no smith',150,'5–9|5–9'),X('Leg press 45°',120,'5–9|5–9'),X('Cadeira extensora',120,H,PK),X('Cadeira adutora',120,H),X('Stiff com barra',150,'5–9|9–15'),X('Elevação pélvica · máquina ou smith',150,'5–9|'+CL,CN),X('Cadeira flexora · tronco inclinado',120,'6 + falha|6 + falha',PK)]},
D:{n:'Full-upper',t:'Superiores completo',u:1,e:[
X('Puxada pela frente · neutra',150,H),X('Remada cavalinho · neutra',150,'5–9|9–15'),X('Pullover com halter',90,'9–15'),X('Supino 30° no smith',150,'5–9|9–15'),X('Crucifixo 45° no cross',120,H,PK),X('Flexão de braços no solo',90,'Falha'),X('Elevação frontal com corda no cross',90,'9–15'),X('Elevação lateral com halteres',120,H),X('Rosca com corda no cross',90,'9–15',PK),X('Tríceps por trás da nuca · manopla dupla',90,'9–15',PK)]},
E:{n:'Legs Hams+',t:'Ênfase em posteriores',e:[
X('Flexora vertical unilateral',120,H),X('Mesa flexora',120,H,PK),X('Stiff com barra',150,'5–9|9–15'),X('Elevação pélvica · máquina ou smith',150,'5–9|9–15'),X('Cadeira abdutora · tronco inclinado',120,H,PK),X('Agachamento no hack',150,'5–9|9–15'),X('Cadeira extensora',120,H)]}
};
const EXT=[X('Abs supra na máquina · RPE 9',60,'12–15|12–15|12–15'),X('Cadeira solear · RPE 9',60,'12–15|12–15|12–15'),X('Prancha isométrica até a falha',90,'Falha|Falha|Falha')];
const K='yan.treino.v1',today=iso(new Date());
let S={hist:{},done:{},date:'',tab:'t',day:'',cal:new Date()};
try{const r=JSON.parse(localStorage.getItem(K));if(r){S.hist=r.hist||{};S.done=r.done||{};S.date=r.date||''}}catch(e){}
if(S.date!==today){S.done={};S.date=today}
const save=()=>{try{localStorage.setItem(K,JSON.stringify({hist:S.hist,done:S.done,date:S.date}))}catch(e){}};
const W=[0,'A','B','C',0,'D','E'][new Date().getDay()];
S.day=W||'A';
const DAYS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const now=new Date();
$('#dt').textContent=DAYS[now.getDay()][0].toUpperCase()+DAYS[now.getDay()].slice(1)+', '+now.getDate()+' de '+MES[now.getMonth()].toLowerCase();
let n=0;$('#nm').innerHTML='Yan Mendonça'.split(' ').map((w,wi)=>'<span>'+[...w].map(c=>`<i class="${wi?'':'r'}" style="--n:${n++}">${c}</i>`).join('')+'</span>').join('');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function burst(){for(let i=0;i<30;i++){const p=document.createElement('span');p.className='pt';p.style.left='50%';p.style.top='60%';p.style.setProperty('--x',(Math.random()*340-170)+'px');p.style.setProperty('--y',(Math.random()*-420-40)+'px');p.style.background=i%3?'#e5121b':'#fff';document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}}
/* descanso */
const R={end:0,tot:1,iv:0};
function rest(s){R.tot=s;R.end=Date.now()+s*1000;$('#rest').classList.remove('go');$('#rest').classList.add('on');clearInterval(R.iv);R.iv=setInterval(tick,200);tick()}
function tick(){const l=Math.max(0,Math.ceil((R.end-Date.now())/1000));$('#rt').textContent=fmt(l);$('#rr').style.strokeDashoffset=276.5*(1-l/Math.max(1,R.tot));if(l<=0){clearInterval(R.iv);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}$('#rest').classList.add('go');setTimeout(()=>$('#rest').classList.remove('on','go'),1800)}}
$('#r15').onclick=()=>{R.end+=15000;R.tot+=15;tick()};
$('#rsk').onclick=()=>{clearInterval(R.iv);$('#rest').classList.remove('on')};
/* treino */
function card(x,i,p){const ss=x.s.split('|');return `<article class="ex" style="--i:${i}"><div class="eh"><h3>${x.n}</h3><button class="rb" data-r="${x.r}" aria-label="Iniciar descanso">${fmt(x.r)}</button></div>${x.o?`<p class="no">${x.o}</p>`:''}${p==='m'&&i<2?'<p class="fd">Feeder: 2 séries de 6–8 a 70% da carga, 2 min</p>':''}<div class="sets">${ss.map((s,j)=>{const k=p+S.day+i+'_'+j;return `<button class="st${S.done[k]?' on':''}" data-k="${k}" data-r="${x.r}">${s}</button>`}).join('')}</div></article>`}
function prog(){const a=document.querySelectorAll('.ex[data-m] .st'),d=document.querySelectorAll('.ex[data-m] .st.on');const b=$('#pb');if(!b)return;const p=a.length?Math.round(d.length/a.length*100):0;b.style.width=p+'%';$('#pp').textContent=p+'%';$('#pn').textContent=d.length+' de '+a.length+' séries';document.querySelectorAll('.ex').forEach(e=>e.classList.toggle('ok',e.querySelectorAll('.st').length>0&&!e.querySelector('.st:not(.on)')))}
function vT(){const d=D[S.day];
 const pills=Object.keys(D).map(k=>`<button class="pill${k===S.day?' on':''}${k===W?' td':''}" data-d="${k}">${k}</button>`).join('');
 const wu=d.u?'Antes: 2 a 3 séries de rotações internas e externas.':'Antes: mobilidade de inferiores, principalmente tornozelo.';
 return `${W?'':'<div class="ex" style="border-left-color:#fff"><b>Hoje é dia de descanso.</b> <span class="mu">Escolha uma letra abaixo se quiser treinar.</span></div>'}
 <div class="pills">${pills}</div>
 <div class="dh"><h2>${S.day} · ${d.n}</h2><p>${d.t}. Séries em RPE 10, falha concêntrica.</p></div>
 <div class="bar"><b id="pb"></b></div><div class="pc"><span id="pn"></span><span id="pp"></span></div>
 <details><summary>Aquecimento e feeder-sets</summary><p>${wu}</p><p>Antes do primeiro exercício: 2 séries de 12 a 15 repetições, bem longe da falha.</p><p>Nos dois primeiros exercícios: 2 séries de 6 a 8 repetições com 70% da carga de trabalho, 2 min de descanso.</p></details>
 ${d.e.map((x,i)=>card(x,i,'m').replace('class="ex"','class="ex" data-m').replace('class="ex" data-m style','class="ex" data-m style')).join('')}
 <div class="sec">Extras · dias alternados</div>${EXT.map((x,i)=>card(x,i,'x')).join('')}
 <button class="fin" id="fin">Finalizar treino</button><p class="ctr mu">Depois: 40 min de cardio na aba Cardio.</p>`}
/* cardio */
const C={el:0,run:0,t0:0,tot:2400,iv:0};
const cel=()=>C.el+(C.run?(Date.now()-C.t0)/1000:0);
function vC(){return `<div class="dh"><h2>Cardio pós-treino</h2><p>${C.tot/60} min, sem contar o gasto do NEAT.</p></div>
 <div class="ring${C.run?' run':''}" id="cr"><svg viewBox="0 0 240 240"><circle class="tr" cx="120" cy="120" r="110"/><circle class="pg" id="cg" cx="120" cy="120" r="110"/></svg><div class="c"><span class="big" id="ct">0:00</span><span class="mu" id="cp"></span></div></div>
 <div class="row"><button class="btn" id="cm">−5</button><button class="btn p" id="cs">${C.run?'Pausar':cel()>0?'Continuar':'Iniciar'}</button><button class="btn" id="cpl">+5</button></div>
 <div class="row" style="margin-top:10px"><button class="btn" id="crs">Zerar</button><button class="btn" id="cf">Concluir cardio</button></div>`}
function ctick(){const e=Math.min(cel(),C.tot),t=$('#ct');if(!t)return;t.textContent=fmt(C.tot-e);$('#cg').style.strokeDashoffset=691*(e/C.tot);$('#cp').textContent=e<=0?'Pronto para começar':e<300?'Aquecimento leve':e<C.tot-300?'Ritmo constante':'Desaceleração';if(e>=C.tot&&C.run){cpause();doneCardio()}}
function cpause(){C.el=cel();C.run=0;clearInterval(C.iv);const r=$('#cr');r&&r.classList.remove('run');const b=$('#cs');b&&(b.textContent='Continuar')}
function cstart(){C.t0=Date.now();C.run=1;C.iv=setInterval(ctick,250);$('#cr').classList.add('run');$('#cs').textContent='Pausar'}
function doneCardio(){S.hist[today]={...(S.hist[today]||{}),c:1};save();burst();toast('Cardio concluído');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
/* histórico */
function vH(){const c=S.cal,y=c.getFullYear(),m=c.getMonth(),first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<i></i>';let t=0,cd=0;
 for(let d=1;d<=nd;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),h=S.hist[k];if(h){if(h.d)t++;if(h.c)cd++}cells+=`<b class="${h?'h':''}${k===today?' td':''}" style="--i:${d}">${d}${h?`<u>${h.d||''}</u>${h.c?'<s></s>':''}`:''}</b>`}
 const tot=Object.values(S.hist).filter(h=>h.d).length;
 return `<div class="hd"><button id="pm" aria-label="Mês anterior">‹</button><h2 style="font-size:34px">${MES[m]} ${y}</h2><button id="nx" aria-label="Próximo mês">›</button></div>
 <div class="stats"><div><div class="big">${t}</div><span>Treinos no mês</span></div><div><div class="big">${cd}</div><span>Cardios no mês</span></div><div><div class="big">${tot}</div><span>Treinos no total</span></div></div>
 <div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<em>${x}</em>`).join('')}${cells}</div><p class="mu">Letra = treino feito. Ponto branco = cardio feito.</p>`}
/* guia */
function vG(){const r=[[7,'4 a 6 repetições na reserva'],[8,'2 a 3 repetições na reserva'],[9,'1 repetição na reserva'],[10,'Falha concêntrica'],[11,'1 a 2 repetições roubadas'],[12,'Usar técnicas para ir além da falha'],[13,'Repetições roubadas após falha total com técnica']];
 return `<div class="dh"><h2>Guia do treino</h2><p>Percepção de esforço (RPE)</p></div>
 ${r.map(([a,b])=>`<div class="rpe"><strong>${a}</strong><div style="--w:${(a-6)/7*100}%"><span>${b}</span></div></div>`).join('')}
 <details open><summary>Cluster-set</summary><p>Use uma carga para 8 repetições. Faça 3, descanse 15s, faça mais 3 e siga até completar 12.</p></details>
 <details><summary>Aquecimento</summary><p>Superiores: 2 a 3 séries de rotações internas e externas. Inferiores: mobilidade, principalmente tornozelo. Antes do primeiro exercício: 2 séries de 12 a 15 repetições, bem longe da falha, para irrigação sanguínea e lubrificação articular.</p></details>
 <details><summary>Feeder-sets</summary><p>2 séries de 6 a 8 repetições com 70% da carga de trabalho, longe da falha, com 2 min de descanso, nos dois primeiros exercícios.</p></details>
 <details><summary>Abdômen e cardio</summary><p>Abdômen: 3 séries de prancha isométrica até a falha. Cardio: 40 min pós-treino, sem considerar o gasto do NEAT.</p></details>
 <details><summary>Semana</summary><p>Seg A Pull · Ter B Push · Qua C Legs Quad+ · Qui descanso · Sex D Full-upper · Sáb E Legs Hams+ · Dom descanso.</p></details>`}
/* roteamento e eventos */
function go(t){S.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const v=$('#v');v.innerHTML=({t:vT,c:vC,h:vH,g:vG})[t]();if(t==='t')prog();if(t==='c')ctick();window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
$('#v').onclick=e=>{const t=e.target.closest('button');if(!t)return;
 if(t.classList.contains('st')){const on=t.classList.toggle('on');if(on){S.done[t.dataset.k]=1;rest(+t.dataset.r);try{navigator.vibrate&&navigator.vibrate(20)}catch(x){}}else delete S.done[t.dataset.k];save();prog()}
 else if(t.classList.contains('rb'))rest(+t.dataset.r);
 else if(t.dataset.d){S.day=t.dataset.d;go('t')}
 else if(t.id==='fin'){S.hist[today]={...(S.hist[today]||{}),d:S.day};save();burst();toast('Treino '+S.day+' salvo no histórico')}
 else if(t.id==='cs'){C.run?cpause():cstart()}
 else if(t.id==='cm'){C.tot=Math.max(300,C.tot-300);go('c')}
 else if(t.id==='cpl'){C.tot=Math.min(5400,C.tot+300);go('c')}
 else if(t.id==='crs'){cpause();C.el=0;go('c')}
 else if(t.id==='cf'){cpause();doneCardio();go('c')}
 else if(t.id==='pm'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);go('h')}
 else if(t.id==='nx'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);go('h')}};
go('t');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script>
</body>
</html>
